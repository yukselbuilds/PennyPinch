name: H006 and H037 Windows 10 startup correction
on:
  push:
    branches: [codex/h037-win10-engine-20261126]
permissions:
  contents: read
concurrency:
  group: h037-clean-windows10-engine
  cancel-in-progress: false
jobs:
  build:
    name: Build the Windows startup candidate
    runs-on: windows-2025
    timeout-minutes: 25
    outputs:
      candidate_sha256: ${{ steps.compile.outputs.sha256 }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Build the executable
        id: compile
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $env:npm_config_cache = "$env:RUNNER_TEMP/pp-npm-cache"
          npm.cmd install --prefix "$env:RUNNER_TEMP/pp-tools" --no-save --ignore-scripts --no-audit --no-fund pnpm@11.25.0
          $pnpm = "$env:RUNNER_TEMP/pp-tools/node_modules/pnpm/bin/pnpm.cjs"
          if ((node $pnpm --version).Trim() -cne '11.25.0') { throw 'Use pnpm 11.25.0.' }
          node $pnpm --store-dir "$env:RUNNER_TEMP/pp-store" install --frozen-lockfile
          node $pnpm run build
          rustup toolchain install 1.92.0 --profile minimal
          $env:CARGO_TARGET_DIR = "$env:RUNNER_TEMP/pp-target"
          $env:RUSTFLAGS = "--remap-path-prefix=$env:GITHUB_WORKSPACE=/pennypinch"
          cargo +1.92.0 build --locked --manifest-path src-tauri/Cargo.toml --release --features custom-protocol
          $exe = "$env:CARGO_TARGET_DIR/release/headroom-desktop.exe"
          if ((Get-Item -LiteralPath $exe).Length -gt 24000000) { throw 'Candidate exceeds the test file limit.' }
          $candidate = "$env:RUNNER_TEMP/pp-candidate.exe"
          Copy-Item -LiteralPath $exe -Destination $candidate
          $digest = (Get-FileHash -LiteralPath $candidate -Algorithm SHA256).Hash.ToLowerInvariant()
          "sha256=$digest" >> $env:GITHUB_OUTPUT
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: pp-win10-candidate
          path: ${{ runner.temp }}/pp-candidate.exe
          retention-days: 1
          if-no-files-found: error
  preview:
    name: Verify the startup candidate on clean Windows 10 x64
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 29
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: pp-win10-candidate
          path: ${{ runner.temp }}/pp-candidate
      - name: Verify official media and prepare a temporary guest
        shell: bash
        env:
          PP_CANDIDATE_SHA256: ${{ needs.build.outputs.candidate_sha256 }}
        run: |
          set -euo pipefail
          test -c /dev/kvm
          sudo setfacl -m "u:$USER:rw" /dev/kvm
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends qemu-system-x86 qemu-utils xorriso tesseract-ocr
          mkdir -p "$RUNNER_TEMP/pp-clean/answer/scripts" "$RUNNER_TEMP/pp-clean/answer/docs/proofs"
          recipe="$GITHUB_WORKSPACE/.github/h037-clean-windows10"
          cp "$recipe/guest.ps1" "$recipe/desktop.ps1" "$RUNNER_TEMP/pp-clean/answer/"
          cp scripts/check-windows-preview.ps1 "$RUNNER_TEMP/pp-clean/answer/scripts/"
          cp docs/proofs/pennypinch-windows10-preview8-local.json "$RUNNER_TEMP/pp-clean/answer/docs/proofs/"
          cd "$RUNNER_TEMP/pp-clean"
          test "$(df --output=avail -B1 . | tail -1)" -ge 23622320128
          [[ "$PP_CANDIDATE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          cp "$RUNNER_TEMP/pp-candidate/pp-candidate.exe" answer/candidate.exe
          printf '%s  answer/candidate.exe\n' "$PP_CANDIDATE_SHA256" | sha256sum -c -
          cp "$GITHUB_WORKSPACE/runtime/desktop_helper.py" answer/
          expected_helper=$(sed -n '/^const EXPECTED_HELPER_SHA256:/{n;s/[^0-9a-f]//g;p;q;}' "$GITHUB_WORKSPACE/src-tauri/src/runtime/manager.rs")
          [[ "$expected_helper" =~ ^[0-9a-f]{64}$ ]]
          printf '%s  answer/desktop_helper.py\n' "$expected_helper" | sha256sum -c -
          printf '%s\n%s\n' "$PP_CANDIDATE_SHA256" "$expected_helper" > answer/candidate.sha256
          python3 - "$recipe/Autounattend.xml" <<'PY'
          from pathlib import Path
          import secrets
          import sys
          import xml.etree.ElementTree as ET
          source = Path(sys.argv[1]).read_text()
          assert source.count("EPHEMERAL-PASSWORD") == 2
          answer = source.replace("EPHEMERAL-PASSWORD", "Pp1-" + secrets.token_hex(20))
          ET.fromstring(answer)
          Path("answer/Autounattend.xml").write_text(answer)
          PY
          curl --silent --show-error --fail --location --retry 1 --max-time 420 \
            --output windows.iso 'https://software-static.download.prss.microsoft.com/dbazure/988969d5-f34g-4e03-ac9d-1f9786c66750/19045.2006.220908-0225.22h2_release_svc_refresh_CLIENTENTERPRISEEVAL_OEMRET_x64FRE_en-us.iso'
          printf 'ef7312733a9f5d7d51cfa04ac497671995674ca5e1058d5164d6028f0938d668  windows.iso\n' | sha256sum -c -
          curl --silent --show-error --fail --location --retry 1 --max-time 120 \
            --output answer/preview.zip 'https://github.com/yukselbuilds/PennyPinch/releases/download/v0.1.1-preview.8/PennyPinch_0.1.1-preview.8_Windows_x64_preview.zip'
          printf '6fc4ae34a1a2b9404f0db1b7ea2763fd75b148cce0c0b2fd4fb0b528c85374be  answer/preview.zip\n' | sha256sum -c -
          curl --silent --show-error --fail --location --retry 1 --max-time 160 \
            --output answer/webview2.exe 'https://msedge.sf.dl.delivery.mp.microsoft.com/filestreamingservice/files/58f85fae-b5f5-4443-9b8d-6d4cf627d6f6/MicrosoftEdgeWebView2RuntimeInstallerX64.exe'
          printf '45769d66809a9652050f8a91ab5329881b65cc4123fe7c733841deefbef91bf6  answer/webview2.exe\n' | sha256sum -c -
          printf '::notice title=H037 verified inputs::%s\n' "$(sha256sum windows.iso answer/preview.zip answer/webview2.exe answer/candidate.exe answer/desktop_helper.py | tr '\n' ' ')"
          xorriso -as mkisofs -quiet -J -r -V PPAUDIT -o answer.iso answer
          qemu-img create -f qcow2 clean.qcow2 45G
      - name: Install and verify the public preview
        shell: bash
        run: |
          cd "$RUNNER_TEMP/pp-clean"
          python3 "$GITHUB_WORKSPACE/.github/h037-clean-windows10/host.py"
