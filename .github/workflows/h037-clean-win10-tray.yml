name: H037 clean Windows 10 system tray
on:
  push:
    branches: [codex/h037-clean-win10-tray-20261127]
permissions:
  contents: read
  actions: read
concurrency:
  group: h037-clean-win10-tray-20261127
  cancel-in-progress: false
jobs:
  desktop:
    name: Verify native tray on clean Windows 10 x64
    runs-on: ubuntu-24.04
    timeout-minutes: 44
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: h037-win10-test-installer
          github-token: ${{ github.token }}
          run-id: 45967293974
          path: ${{ runner.temp }}/pp-clean/answer
      - name: Verify installation media and prepare a temporary guest
        shell: bash
        env:
          PP_INSTALLER_SHA256: 9857aca2c1fe31b3976685c18b94d02f93887756680f0fd7a1b569449fc4dfeb
          PP_BUILD_SHA: be0e1562e7a65bbff4555408b9f310e32b471158
        run: |
          set -euo pipefail
          test -c /dev/kvm
          sudo setfacl -m "u:$USER:rw" /dev/kvm
          timeout 180 sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 update -qq
          timeout 180 sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 install -y -qq --no-install-recommends qemu-system-x86 qemu-utils xorriso tesseract-ocr aria2
          recipe="$GITHUB_WORKSPACE/.github/h037-clean-win10-tray"
          cd "$RUNNER_TEMP/pp-clean"
          test "$(df --output=avail -B1 . | tail -1)" -ge 23622320128
          [[ "$PP_INSTALLER_SHA256" =~ ^[0-9a-f]{64}$ ]]
          printf '%s  answer/setup.exe\n' "$PP_INSTALLER_SHA256" | sha256sum -c -
          cp "$recipe/guest.ps1" "$recipe/desktop.ps1" "$recipe/engine-processes.py" "$recipe/tray.ps1" answer/
          python3 - "$recipe/Autounattend.xml" <<'PY'
          import json
          import os
          from pathlib import Path
          import secrets
          import sys
          import xml.etree.ElementTree as ET
          info = json.loads(Path("answer/candidate.json").read_bytes())
          assert info["source_commit"] == os.environ["PP_BUILD_SHA"]
          assert info["installer_sha256"] == os.environ["PP_INSTALLER_SHA256"]
          assert info["installer_bytes"] == Path("answer/setup.exe").stat().st_size
          source = Path(sys.argv[1]).read_text()
          assert source.count("EPHEMERAL-PASSWORD") == 2
          answer = source.replace("EPHEMERAL-PASSWORD", "Pp1-" + secrets.token_hex(20))
          ET.fromstring(answer)
          Path("answer/Autounattend.xml").write_text(answer)
          PY
          printf '::notice title=H037 reused installer::%s\n' "$(cat answer/candidate.json)"
          echo '::notice title=H037 media download::{"stage":"windows_iso"}'
          timeout 360 aria2c --dir=. --out=windows.iso --max-connection-per-server=8 --split=8 --min-split-size=32M \
            --file-allocation=none --summary-interval=0 --console-log-level=warn --connect-timeout=15 --timeout=30 --max-tries=2 --retry-wait=2 \
            --checksum=sha-256=ef7312733a9f5d7d51cfa04ac497671995674ca5e1058d5164d6028f0938d668 \
            'https://software-static.download.prss.microsoft.com/dbazure/988969d5-f34g-4e03-ac9d-1f9786c66750/19045.2006.220908-0225.22h2_release_svc_refresh_CLIENTENTERPRISEEVAL_OEMRET_x64FRE_en-us.iso'
          printf 'ef7312733a9f5d7d51cfa04ac497671995674ca5e1058d5164d6028f0938d668  windows.iso\n' | sha256sum -c -
          echo '::notice title=H037 prerequisite download::{"stage":"webview2"}'
          curl --silent --show-error --fail --location --retry 2 --max-time 150 \
            --output answer/webview2.exe 'https://msedge.sf.dl.delivery.mp.microsoft.com/filestreamingservice/files/58f85fae-b5f5-4443-9b8d-6d4cf627d6f6/MicrosoftEdgeWebView2RuntimeInstallerX64.exe'
          printf '45769d66809a9652050f8a91ab5329881b65cc4123fe7c733841deefbef91bf6  answer/webview2.exe\n' | sha256sum -c -
          printf '::notice title=H037 verified inputs::%s\n' "$(sha256sum windows.iso answer/setup.exe answer/webview2.exe | tr '\n' ' ')"
          xorriso -as mkisofs -quiet -J -r -V PPAUDIT -o answer.iso answer
          qemu-img create -f qcow2 clean.qcow2 45G
      - name: Open, pause, resume and quit from the Windows tray
        shell: bash
        run: |
          cd "$RUNNER_TEMP/pp-clean"
          python3 "$GITHUB_WORKSPACE/.github/h037-clean-win10-tray/host.py"
