name: H037 clean Windows 10 live Codex
on:
  push:
    branches: [codex/h037-clean-win10-live-20261127]
permissions:
  contents: read
  actions: read
concurrency:
  group: h037-clean-win10-live-20261127
  cancel-in-progress: false
jobs:
  desktop:
    name: Live Codex from the installed app on clean Windows 10
    runs-on: ubuntu-24.04
    timeout-minutes: 57
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: h037-win10-test-installer
          github-token: ${{ github.token }}
          run-id: 45967293974
          path: ${{ runner.temp }}/pp-clean/answer
      - name: Verify installation media and prepare a temporary guest
        shell: bash
        env:
          PP_INSTALLER_SHA256: 9857aca2c1fe31b3976685c18b94d02f93887756680f0fd7a1b569449fc4dfeb
          PP_BUILD_SHA: be0e1562e7a65bbff4555408b9f310e32b471158
        run: |
          set -euo pipefail
          test -c /dev/kvm
          sudo setfacl -m "u:$USER:rw" /dev/kvm
          timeout 180 sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 update -qq
          timeout 180 sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 install -y -qq --no-install-recommends qemu-system-x86 qemu-utils xorriso tesseract-ocr aria2
          recipe="$GITHUB_WORKSPACE/.github/h037-clean-win10-live"
          cd "$RUNNER_TEMP/pp-clean"
          test "$(df --output=avail -B1 . | tail -1)" -ge 23622320128
          [[ "$PP_INSTALLER_SHA256" =~ ^[0-9a-f]{64}$ ]]
          printf '%s  answer/setup.exe\n' "$PP_INSTALLER_SHA256" | sha256sum -c -
          cp "$recipe/guest.ps1" "$recipe/desktop.ps1" "$recipe/engine-processes.py" "$recipe/codex-live.ps1" \
            "$recipe/live-client.py" "$recipe/encrypt-challenge.ps1" "$recipe/device-public.json" answer/
          python3 - "$recipe/Autounattend.xml" <<'PY'
          import json
          import os
          from pathlib import Path
          import secrets
          import sys
          import xml.etree.ElementTree as ET
          info = json.loads(Path("answer/candidate.json").read_bytes())
          assert info["source_commit"] == os.environ["PP_BUILD_SHA"]
          assert info["installer_sha256"] == os.environ["PP_INSTALLER_SHA256"]
          assert info["installer_bytes"] == Path("answer/setup.exe").stat().st_size
          source = Path(sys.argv[1]).read_text()
          assert source.count("EPHEMERAL-PASSWORD") == 2
          answer = source.replace("EPHEMERAL-PASSWORD", "Pp1-" + secrets.token_hex(20))
          ET.fromstring(answer)
          Path("answer/Autounattend.xml").write_text(answer)
          PY
          printf '::notice title=H037 reused installer::%s\n' "$(cat answer/candidate.json)"
          echo '::notice title=H037 media download::{"stage":"windows_iso"}'
          timeout 360 aria2c --dir=. --out=windows.iso --max-connection-per-server=8 --split=8 --min-split-size=32M \
            --file-allocation=none --summary-interval=0 --console-log-level=warn --connect-timeout=15 --timeout=30 --max-tries=2 --retry-wait=2 \
            --checksum=sha-256=ef7312733a9f5d7d51cfa04ac497671995674ca5e1058d5164d6028f0938d668 \
            'https://software-static.download.prss.microsoft.com/dbazure/988969d5-f34g-4e03-ac9d-1f9786c66750/19045.2006.220908-0225.22h2_release_svc_refresh_CLIENTENTERPRISEEVAL_OEMRET_x64FRE_en-us.iso'
          printf 'ef7312733a9f5d7d51cfa04ac497671995674ca5e1058d5164d6028f0938d668  windows.iso\n' | sha256sum -c -
          echo '::notice title=H037 prerequisite download::{"stage":"webview2"}'
          curl --silent --show-error --fail --location --retry 2 --max-time 150 \
            --output answer/webview2.exe 'https://msedge.sf.dl.delivery.mp.microsoft.com/filestreamingservice/files/58f85fae-b5f5-4443-9b8d-6d4cf627d6f6/MicrosoftEdgeWebView2RuntimeInstallerX64.exe'
          printf '45769d66809a9652050f8a91ab5329881b65cc4123fe7c733841deefbef91bf6  answer/webview2.exe\n' | sha256sum -c -
          curl --silent --show-error --fail --location --retry 2 --max-time 180 \
            --output codex.zip 'https://github.com/openai/codex/releases/download/rust-v0.166.0/codex-x86_64-pc-windows-msvc.exe.zip'
          printf 'bf67d9662ed539f305849b74ad6420cc7b23aa2be07753710ca3db9134a0246d  codex.zip\n' | sha256sum -c -
          python3 - <<'PY'
          from pathlib import Path
          from shutil import copyfileobj
          from zipfile import ZipFile
          with ZipFile('codex.zip') as archive:
              entries = [item for item in archive.infolist() if item.file_size == 371735856
                         and Path(item.filename).name in {'codex.exe', 'codex-x86_64-pc-windows-msvc.exe'}]
              assert len(entries) == 1
              with archive.open(entries[0]) as source, Path('answer/codex.exe').open('xb') as target:
                  copyfileobj(source, target, 1024 * 1024)
          PY
          printf '9d563ee4e0441ff9d59d612013e0460ddf8e5709735c2d9f6b98b7ef8ca4eb42  answer/codex.exe\n' | sha256sum -c -
          printf '::notice title=H037 verified inputs::%s\n' "$(sha256sum windows.iso answer/setup.exe answer/webview2.exe answer/codex.exe | tr '\n' ' ')"
          xorriso -as mkisofs -quiet -J -r -V PPAUDIT -o answer.iso answer
          qemu-img create -f qcow2 clean.qcow2 45G
      - name: Start the clean guest and wait for an encrypted device challenge
        timeout-minutes: 28
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/pp-clean"
          nohup bash -c '
            set +e
            python3 "$1"
            code=$?
            printf "%s\n" "$code" > vm-exit.partial
            mv vm-exit.partial vm-exit
          ' bash "$GITHUB_WORKSPACE/.github/h037-clean-win10-live/host.py" > vm.log 2>&1 </dev/null &
          for ((attempt = 0; attempt < 165; attempt++)); do
            if [[ -f device-challenge.json ]]; then exit 0; fi
            if [[ -f vm-exit ]]; then
              grep '^::notice title=H037 ' vm.log || true
              exit 1
            fi
            sleep 10
          done
          exit 1
      - name: Publish only the encrypted device challenge
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: h037-encrypted-device-challenge
          path: ${{ runner.temp }}/pp-clean/device-challenge.json
          retention-days: 1
          if-no-files-found: error
      - name: Verify one live turn, undo and exit
        timeout-minutes: 19
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/pp-clean"
          for ((attempt = 0; attempt < 110; attempt++)); do
            if [[ -f vm-exit ]]; then
              grep '^::notice title=H037 ' vm.log
              test "$(cat vm-exit)" = 0
              exit
            fi
            sleep 10
          done
          exit 1
  receipt:
    name: Read the encrypted device challenge
    runs-on: ubuntu-24.04
    timeout-minutes: 29
    steps:
      - name: Relay encrypted bytes from this run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          job_root="/repos/$GITHUB_REPOSITORY/actions"
          for ((attempt = 0; attempt < 112; attempt++)); do
            artifact="$(gh api "$job_root/runs/$GITHUB_RUN_ID/artifacts?name=h037-encrypted-device-challenge" \
              --jq '.artifacts | map(select(.expired == false)) | first | .id // empty')"
            if [[ "$artifact" =~ ^[0-9]+$ ]]; then
              gh api "$job_root/artifacts/$artifact/zip" > "$RUNNER_TEMP/device.zip"
              python3 - "$RUNNER_TEMP/device.zip" <<'PY'
          import json
          import re
          import sys
          from zipfile import ZipFile
          with ZipFile(sys.argv[1]) as archive:
              assert archive.namelist() == ["device-challenge.json"]
              assert archive.getinfo("device-challenge.json").file_size < 700
              item = json.loads(archive.read("device-challenge.json"))
          assert set(item) == {"challenge_id", "ciphertext"}
          assert re.fullmatch("[a-f0-9]{32}", item["challenge_id"])
          assert re.fullmatch("[A-Za-z0-9+/]{512}", item["ciphertext"])
          print("::notice title=H037 encrypted device challenge::" + json.dumps(item, separators=(",", ":")))
          PY
              exit 0
            fi
            state="$(gh api "$job_root/runs/$GITHUB_RUN_ID/jobs" --jq '.jobs[] | select(.name == "Live Codex from the installed app on clean Windows 10") | .status')"
            if [[ "$state" == "completed" ]]; then exit 1; fi
            sleep 15
          done
          exit 1
