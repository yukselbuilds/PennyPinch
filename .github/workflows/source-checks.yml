name: Source checks

on:
  workflow_dispatch:
    inputs:
      free_only_confirmed:
        description: Confirm that this run fits the current free standard-runner allocation and account hard stop.
        required: true
        type: boolean
        default: false
      linux_desktop:
        description: Check Linux configuration safety, build the desktop, and open it in Xvfb.
        type: boolean
        default: false
      linux_config_transaction:
        description: Check atomic file replacement and process interruption on ext4.
        type: boolean
        default: false
      linux_engine:
        description: Check the pinned Linux engine with a loopback-only provider fixture.
        type: boolean
        default: false
      linux_managed_engine:
        description: Verify the pinned engine through the Linux desktop runtime manager.
        type: boolean
        default: false
      linux_cli_discovery:
        description: Verify Linux CLI discovery and selection with pinned native files.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: source-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-engine:
    if: ${{ inputs.free_only_confirmed == true && inputs.linux_engine == true }}
    name: Pinned Linux engine (Ubuntu standard runner)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Verify the relocated Linux engine
        shell: bash
        run: bash scripts/probe-linux-engine.sh

  frontend-source:
    if: ${{ inputs.free_only_confirmed == true }}
    name: Frontend source checks (Ubuntu standard runner)
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ (inputs.linux_desktop || inputs.linux_managed_engine || inputs.linux_cli_discovery) && 25 || 10 }}
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up pinned Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Install pinned pnpm and run source checks
        shell: bash
        env:
          npm_config_cache: ${{ github.workspace }}/work/.npm-cache
        run: |
          set -euo pipefail

          if ! mkdir -p work/.npm-cache work/ci-tools work/caches/pnpm >/dev/null 2>&1; then
            echo "::error::Could not prepare project-local tool and cache directories."
            exit 1
          fi

          if bootstrap_output="$(npm install --prefix work/ci-tools --no-save --ignore-scripts --no-audit --no-fund pnpm@11.25.0 2>&1)"; then
            echo "Pinned pnpm bootstrap: passed."
          else
            status=$?
            echo "::error::Pinned pnpm bootstrap failed (exit ${status}). Reproduce with: npm install --prefix work/ci-tools --no-save --ignore-scripts --no-audit --no-fund pnpm@11.25.0"
            exit "$status"
          fi

          pnpm_entry="$GITHUB_WORKSPACE/work/ci-tools/node_modules/pnpm/bin/pnpm.cjs"
          if actual_pnpm_version="$(node "$pnpm_entry" --version 2>&1)" && [[ "$actual_pnpm_version" == "11.25.0" ]]; then
            echo "Pinned pnpm version check: passed."
          else
            status=$?
            echo "::error::Pinned pnpm version check failed (exit ${status}). Expected version 11.25.0."
            exit 1
          fi

          if install_output="$(node "$pnpm_entry" --store-dir work/caches/pnpm install --frozen-lockfile 2>&1)"; then
            echo "Frozen dependency install: passed."
          else
            status=$?
            echo "::error::Frozen dependency install failed (exit ${status}). Reproduce with: pnpm --store-dir work/caches/pnpm install --frozen-lockfile"
            exit "$status"
          fi

          if test_output="$(node "$pnpm_entry" test:app 2>&1)"; then
            test_count="$(printf '%s\n' "$test_output" | sed -nE 's/^[[:space:]]*((ℹ|#)[[:space:]]+)?tests[[:space:]]+([0-9]+)[[:space:]]*$/\3/p' | tail -n 1)"
            if [[ "$test_count" =~ ^[0-9]+$ ]]; then
              echo "App tests: passed (${test_count})."
              app_test_summary="passed (${test_count})"
            else
              echo "App tests: passed (count unavailable)."
              app_test_summary='passed; count unavailable'
            fi
          else
            status=$?
            echo "::error::App tests failed (exit ${status}). Reproduce with: pnpm test:app"
            exit "$status"
          fi

          if build_output="$(node "$pnpm_entry" build 2>&1)"; then
            echo "Frontend build: passed."
          else
            status=$?
            echo "::error::Frontend build failed (exit ${status}). Reproduce with: pnpm build"
            exit "$status"
          fi

          printf '%s\n' '## Source-only checks' '' "- App tests: ${app_test_summary}." '- Frontend build: passed.' '- Scope: source-only frontend; no engine or native runtime validation.' >> "$GITHUB_STEP_SUMMARY"

      - name: Probe Linux file replacement on ext4
        if: ${{ inputs.linux_config_transaction == true }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test "$(uname -sm)" = 'Linux x86_64'
          test "$(id -u)" -ne 0
          test "$(pwd -P)" = "$GITHUB_WORKSPACE"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --quiet HEAD --
          stage="$(mktemp -d "$GITHUB_WORKSPACE/work/linux-tx.XXXXXXXX")"
          mkdir -m 700 "$stage/fixture"
          test "$(findmnt --target "$stage/fixture" --noheadings --output FSTYPE)" = ext4
          source=tests/native/config_transaction_probe.c
          recipe=.github/workflows/source-checks.yml
          compiler="$(command -v cc)"
          fingerprint() {
            git rev-parse HEAD 'HEAD^{tree}'
            uname -smr
            getconf GNU_LIBC_VERSION
            "$compiler" --version | sed -n '1p'
            printf '%s\n' "${ImageOS:-unknown}" "${ImageVersion:-unknown}"
            sha256sum "$source" "$recipe"
            findmnt --target "$stage/fixture" --noheadings --output FSTYPE
            stat -c '%a' "$stage/fixture"
            umask
          }

          before="$(fingerprint)"
          digest="$(printf '%s\n' "$before" | sha256sum | cut -d' ' -f1)"
          status=0
          if "$compiler" -std=c17 -D_GNU_SOURCE -Wall -Wextra -Werror "$source" -o "$stage/probe" > "$stage/build.log" 2>&1; then
            result="$(cd "$stage/fixture" && timeout 40s "$stage/probe" 2> "$stage/probe.log")" || status=$?
            if [[ "$status" != 0 ]]; then
              awk '/^FAIL:[a-z0-9_]+$/ && ++count <= 5 { print }' "$stage/probe.log"
            fi
          else
            echo '::error::Native Linux probe compilation failed.'
            awk '/error:/ && ++count <= 5 { print substr($0, 1, 220) }' "$stage/build.log"
            status=1
          fi
          after="$(fingerprint)"
          test "$before" = "$after"
          git diff --quiet HEAD --
          test "$status" = 0
          printf 'Inputs before and after: %s\n%s\n' "$digest" "$before"
          printf 'ext4 probe: %s\n' "$result"
          printf '%s\n' '## ext4 file transaction probe' '' "- Commit: $GITHUB_SHA" \
            "- Inputs before and after: $digest" "- Observations: $result" \
            '- Scope: isolated ext4 fixtures and process interruption.' >> "$GITHUB_STEP_SUMMARY"

      - name: Stage the pinned Linux desktop runtime
        if: ${{ inputs.linux_managed_engine == true }}
        shell: bash
        run: bash scripts/probe-linux-engine.sh --stage-managed

      - name: Build and open the Linux desktop
        if: ${{ inputs.linux_desktop == true || inputs.linux_managed_engine == true || inputs.linux_cli_discovery == true }}
        shell: bash
        env:
          CARGO_HOME: ${{ github.workspace }}/work/cargo-home
          CARGO_TARGET_DIR: ${{ github.workspace }}/work/cargo-target
          RUSTUP_HOME: ${{ github.workspace }}/work/rustup
          CARGO_PROFILE_DEV_DEBUG: '0'
          HEADROOM_VERIFY_LINUX_MANAGED_ENGINE: ${{ inputs.linux_managed_engine }}
          HEADROOM_VERIFY_LINUX_CLI_DISCOVERY: ${{ inputs.linux_cli_discovery }}
        run: |
          set -euo pipefail
          test "$(uname -sm)" = 'Linux x86_64'
          cat > work/ubuntu-sources.list <<'APT'
          deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://archive.ubuntu.com/ubuntu noble main universe
          deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://archive.ubuntu.com/ubuntu noble-updates main universe
          deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://security.ubuntu.com/ubuntu noble-security main universe
          APT
          apt_options=(-q -o "Dir::Etc::sourcelist=$PWD/work/ubuntu-sources.list" -o Dir::Etc::sourceparts=-
            -o Acquire::Retries=1 -o Acquire::https::Timeout=25 -o Acquire::Languages=none)
          echo 'Prepare the Ubuntu build dependencies.'
          if ! timeout 150s sudo apt-get "${apt_options[@]}" update > work/linux-deps.log 2>&1; then
            echo '::error::Ubuntu package index update failed or timed out.'
            awk '/^Err:|^E:|^W:/ { if (++count <= 5) print substr($0, 1, 220) }' work/linux-deps.log
            exit 1
          fi
          if ! timeout 150s sudo apt-get "${apt_options[@]}" install --no-install-recommends -y pkg-config libwebkit2gtk-4.1-dev \
              libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev xvfb xauth xdotool acl \
              > work/linux-deps.log 2>&1; then
            echo '::error::Ubuntu build dependency installation failed or timed out.'
            awk '/^Err:|^E:|^W:/ { if (++count <= 5) print substr($0, 1, 220) }' work/linux-deps.log
            exit 1
          fi
          rustup toolchain install 1.92.0 --profile minimal --no-self-update
          manifest=src-tauri/Cargo.toml
          glib="$(cargo +1.92.0 tree --locked --manifest-path "$manifest" --depth 0 -i glib)"
          test "$glib" = "glib v0.18.5 ($GITHUB_WORKSPACE/src-tauri/vendor/glib-0.18.5)"
          printf 'Linux uses %s\n' "$glib"
          export HEADROOM_LINUX_PROOF_ROOT
          HEADROOM_LINUX_PROOF_ROOT="$(mktemp -d "$GITHUB_WORKSPACE/work/linux-config.XXXXXXXX")"
          test "$(id -u)" -ne 0
          test "$(findmnt --target "$HEADROOM_LINUX_PROOF_ROOT" --noheadings --output FSTYPE)" = ext4
          if [[ "$HEADROOM_VERIFY_LINUX_CLI_DISCOVERY" == true ]]; then
            python3 -I -B scripts/prepare-linux-ci-clients.py "$HEADROOM_LINUX_PROOF_ROOT/client-fixtures"
          fi
          fingerprint() {
            git rev-parse HEAD 'HEAD^{tree}'
            uname -smr
            cargo +1.92.0 --version
            rustc +1.92.0 --version
            sha256sum src-tauri/Cargo.lock
            printf '%s\n' "${ImageOS:-unknown}" "${ImageVersion:-unknown}"
            stat -c '%a' "$HEADROOM_LINUX_PROOF_ROOT"
            if [[ "$HEADROOM_VERIFY_LINUX_CLI_DISCOVERY" == true ]]; then
              (cd "$HEADROOM_LINUX_PROOF_ROOT/client-fixtures/bin" && sha256sum codex claude opencode)
            fi
          }
          before="$(fingerprint)"
          if ! cargo +1.92.0 test --locked --manifest-path "$manifest" --features custom-protocol \
            --color never -- linux_config_tests integrations::transaction_fs::linux_impl::tests:: \
            --ignored --skip crash_after_ --skip crash_during_retained_archive \
            --skip managed_engine_routes_an_isolated_connection --test-threads=1 \
            > work/linux-config.log 2>&1; then
            awk '/^error(\[[A-Z][0-9]+\])?: |^---- .* stdout ----$|^assertion failed:|^test result:/ \
              { if (++count <= 12) print substr($0, 1, 220) }
              /^thread .* panicked at / { detail=1; next }
              detail == 1 { if (++count <= 12) print substr($0, 1, 220); detail=0 }' work/linux-config.log
            exit 1
          fi
          rust_tests="$(grep -E '^test result: ok\. [1-9][0-9]* passed;' work/linux-config.log)"
          printf '%s\n' "$rust_tests"
          test "$(grep -Ec '^test .*::(config_transaction_reads_the_same_native_file_as_the_config_reader|transaction_apply_reopen_and_typed_undo_preserve_user_metadata|fresh_action_recovers_owner_after_process_exit_between_publications|retained_review_is_passive_and_archive_keeps_displaced_edits_after_reopen) \.\.\. ok$' work/linux-config.log)" = 4
          if [[ "$HEADROOM_VERIFY_LINUX_CLI_DISCOVERY" == true ]]; then
            discovery='integrations::discovery::linux_tests::native_linux_discovery_preserves_choices_and_does_not_run_clients'
            selections='integrations::transaction_fs::linux_impl::choices::tests'
            if ! cargo +1.92.0 test --locked --manifest-path "$manifest" --features custom-protocol \
              --color never -- "$discovery" "$selections" --ignored --skip owned_selection_file_child \
              --test-threads=1 > work/linux-discovery.log 2>&1; then
              awk '/^error(\[[A-Z][0-9]+\])?: |^---- .* stdout ----$|^test result:/ { print substr($0, 1, 220) }
                /^thread .* panicked at / { detail=2 }
                detail > 0 { print substr($0, 1, 220); detail-- }' work/linux-discovery.log | head -n 30
              exit 1
            fi
            discovery_tests="$(grep -E '^test result: ok\. 3 passed; 0 failed;' work/linux-discovery.log)"
            grep -Fxq "test $discovery ... ok" work/linux-discovery.log
            printf '%s\n' "$discovery_tests"
            printf '%s\n' "- Linux CLI discovery and saved choices: $discovery_tests" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ "$HEADROOM_VERIFY_LINUX_MANAGED_ENGINE" == true ]]; then
            bash scripts/test-linux-managed-engine.sh
          fi
          if ! cargo +1.92.0 build --locked --manifest-path "$manifest" \
            --features custom-protocol --color never > work/linux-build.log 2>&1; then
            awk '/^error(\[[A-Z][0-9]+\])?: / { if (++count <= 8) print substr($0, 1, 220) }' work/linux-build.log
            exit 1
          fi
          export XDG_DATA_HOME="$PWD/work/linux-smoke/data" XDG_CONFIG_HOME="$PWD/work/linux-smoke/config"
          export XDG_CACHE_HOME="$PWD/work/linux-smoke/cache"
          mkdir -p "$XDG_DATA_HOME" "$XDG_CONFIG_HOME" "$XDG_CACHE_HOME"
          if [[ "$HEADROOM_VERIFY_LINUX_MANAGED_ENGINE" == true ]]; then
            resources="$CARGO_TARGET_DIR/lib/PennyPinch"
            mkdir -p "$resources"
            test ! -e "$resources/runtime"
            cp -a --reflink=auto "$HEADROOM_LINUX_RUNTIME_ROOT" "$resources/runtime"
          fi
          timeout 45s xvfb-run -a bash -euo pipefail <<'SH'
          "$CARGO_TARGET_DIR/debug/headroom-desktop" > work/linux-smoke/application.log 2>&1 &
          app=$!
          trap 'kill "$app" 2>/dev/null || :; wait "$app" || :' EXIT
          timeout 30s xdotool search --sync --onlyvisible --pid "$app" --name '^PennyPinch$' >/dev/null
          if [[ "$HEADROOM_VERIFY_LINUX_MANAGED_ENGINE" == true ]]; then
            python3 -I -B - "$XDG_DATA_HOME/dev.headroom.desktop/runtime/connection-endpoint.json" <<'PY'
          import json, socket, sys, time
          from pathlib import Path

          record = Path(sys.argv[1])
          deadline = time.monotonic() + 5
          while not record.is_file() and time.monotonic() < deadline:
              time.sleep(0.05)
          endpoint = json.loads(record.read_bytes())
          assert endpoint["bind_address"] == "127.0.0.1"
          with socket.create_connection(("127.0.0.1", endpoint["port"]), timeout=2) as client:
              assert client.recv(1) == b""
          print("The native desktop opened its stable loopback endpoint with the staged resources.")
          PY
          fi
          SH
          test "$before" = "$(fingerprint)"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --quiet HEAD --
          digest="$(printf '%s\n' "$before" | sha256sum | cut -d' ' -f1)"
          printf 'Inputs before and after: %s\n%s\n' "$digest" "$before"
          printf '%s\n' '## Linux desktop' '' "- Configuration tests on ext4: $rust_tests" \
            "- Inputs before and after: $digest" '- Locked build: passed.' \
            '- PennyPinch window under Xvfb: visible.' >> "$GITHUB_STEP_SUMMARY"
