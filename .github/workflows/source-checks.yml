name: Source checks

on:
  workflow_dispatch:
    inputs:
      free_only_confirmed:
        description: Confirm that this run fits the current free standard-runner allocation and account hard stop.
        required: true
        type: boolean
        default: false
      linux_desktop:
        description: Check Linux configuration safety, build the desktop, and open it in Xvfb.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: source-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-source:
    if: ${{ inputs.free_only_confirmed == true }}
    name: Frontend source checks (Ubuntu standard runner)
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.linux_desktop && 25 || 10 }}
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up pinned Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Install pinned pnpm and run source checks
        shell: bash
        env:
          npm_config_cache: ${{ github.workspace }}/work/.npm-cache
        run: |
          set -euo pipefail

          if ! mkdir -p work/.npm-cache work/ci-tools work/caches/pnpm >/dev/null 2>&1; then
            echo "::error::Could not prepare project-local tool and cache directories."
            exit 1
          fi

          if bootstrap_output="$(npm install --prefix work/ci-tools --no-save --ignore-scripts --no-audit --no-fund pnpm@11.25.0 2>&1)"; then
            echo "Pinned pnpm bootstrap: passed."
          else
            status=$?
            echo "::error::Pinned pnpm bootstrap failed (exit ${status}). Reproduce with: npm install --prefix work/ci-tools --no-save --ignore-scripts --no-audit --no-fund pnpm@11.25.0"
            exit "$status"
          fi

          pnpm_entry="$GITHUB_WORKSPACE/work/ci-tools/node_modules/pnpm/bin/pnpm.cjs"
          if actual_pnpm_version="$(node "$pnpm_entry" --version 2>&1)" && [[ "$actual_pnpm_version" == "11.25.0" ]]; then
            echo "Pinned pnpm version check: passed."
          else
            status=$?
            echo "::error::Pinned pnpm version check failed (exit ${status}). Expected version 11.25.0."
            exit 1
          fi

          if install_output="$(node "$pnpm_entry" --store-dir work/caches/pnpm install --frozen-lockfile 2>&1)"; then
            echo "Frozen dependency install: passed."
          else
            status=$?
            echo "::error::Frozen dependency install failed (exit ${status}). Reproduce with: pnpm --store-dir work/caches/pnpm install --frozen-lockfile"
            exit "$status"
          fi

          if test_output="$(node "$pnpm_entry" test:app 2>&1)"; then
            test_count="$(printf '%s\n' "$test_output" | sed -nE 's/^[[:space:]]*((ℹ|#)[[:space:]]+)?tests[[:space:]]+([0-9]+)[[:space:]]*$/\3/p' | tail -n 1)"
            if [[ "$test_count" =~ ^[0-9]+$ ]]; then
              echo "App tests: passed (${test_count})."
              app_test_summary="passed (${test_count})"
            else
              echo "App tests: passed (count unavailable)."
              app_test_summary='passed; count unavailable'
            fi
          else
            status=$?
            echo "::error::App tests failed (exit ${status}). Reproduce with: pnpm test:app"
            exit "$status"
          fi

          if build_output="$(node "$pnpm_entry" build 2>&1)"; then
            echo "Frontend build: passed."
          else
            status=$?
            echo "::error::Frontend build failed (exit ${status}). Reproduce with: pnpm build"
            exit "$status"
          fi

          printf '%s\n' '## Source-only checks' '' "- App tests: ${app_test_summary}." '- Frontend build: passed.' '- Scope: source-only frontend; no engine or native runtime validation.' >> "$GITHUB_STEP_SUMMARY"

      - name: Build and open the Linux desktop
        if: ${{ inputs.linux_desktop == true }}
        shell: bash
        env:
          CARGO_HOME: ${{ github.workspace }}/work/cargo-home
          CARGO_TARGET_DIR: ${{ github.workspace }}/work/cargo-target
          RUSTUP_HOME: ${{ github.workspace }}/work/rustup
          CARGO_PROFILE_DEV_DEBUG: '0'
        run: |
          set -euo pipefail
          test "$(uname -sm)" = 'Linux x86_64'
          sudo apt-get -qq update
          sudo apt-get -qq install --no-install-recommends -y pkg-config libwebkit2gtk-4.1-dev \
            libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev xvfb xauth xdotool
          rustup toolchain install 1.92.0 --profile minimal --no-self-update
          manifest=src-tauri/Cargo.toml
          glib="$(cargo +1.92.0 tree --locked --manifest-path "$manifest" --depth 0 -i glib)"
          test "$glib" = "glib v0.18.5 ($GITHUB_WORKSPACE/src-tauri/vendor/glib-0.18.5)"
          printf 'Linux uses %s\n' "$glib"
          export HEADROOM_LINUX_PROOF_ROOT
          HEADROOM_LINUX_PROOF_ROOT="$(mktemp -d "$GITHUB_WORKSPACE/work/linux-config.XXXXXXXX")"
          test "$(id -u)" -ne 0
          printf 'Linux test filesystem: %s\n' "$(stat -f -c %T "$HEADROOM_LINUX_PROOF_ROOT")"
          if ! cargo +1.92.0 test --locked --manifest-path "$manifest" --features custom-protocol \
            --color never linux_config_tests -- --ignored --test-threads=1 > work/linux-config.log 2>&1; then
            awk '/^error(\[[A-Z][0-9]+\])?: |^---- .* stdout ----$|^assertion failed:|^test result:/ \
              { if (++count <= 12) print substr($0, 1, 220) }' work/linux-config.log
            exit 1
          fi
          grep -E '^test result: ok\. [1-9][0-9]* passed;' work/linux-config.log
          if ! cargo +1.92.0 build --locked --manifest-path "$manifest" \
            --features custom-protocol --color never > work/linux-build.log 2>&1; then
            awk '/^error(\[[A-Z][0-9]+\])?: / { if (++count <= 8) print substr($0, 1, 220) }' work/linux-build.log
            exit 1
          fi
          export XDG_DATA_HOME="$PWD/work/linux-smoke/data" XDG_CONFIG_HOME="$PWD/work/linux-smoke/config"
          export XDG_CACHE_HOME="$PWD/work/linux-smoke/cache"
          mkdir -p "$XDG_DATA_HOME" "$XDG_CONFIG_HOME" "$XDG_CACHE_HOME"
          timeout 45s xvfb-run -a bash -euo pipefail <<'SH'
          "$CARGO_TARGET_DIR/debug/headroom-desktop" > work/linux-smoke/application.log 2>&1 &
          app=$!
          trap 'kill "$app" 2>/dev/null || :; wait "$app" || :' EXIT
          timeout 30s xdotool search --sync --onlyvisible --pid "$app" --name '^PennyPinch$' >/dev/null
          SH
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --quiet HEAD --
          printf '%s\n' '## Linux desktop' '' '- Configuration safety tests: passed.' '- Locked build: passed.' '- PennyPinch window under Xvfb: visible.' >> "$GITHUB_STEP_SUMMARY"
