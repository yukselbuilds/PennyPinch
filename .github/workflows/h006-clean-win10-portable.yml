name: H006 Windows 10 portable engine
on:
  push:
    branches: [codex/h006-win10-portable-20261127]
permissions:
  contents: read
concurrency:
  group: h006-clean-windows10-portable
  cancel-in-progress: false
jobs:
  preview:
    name: Verify the portable candidate on clean Windows 10 x64
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Verify official media and prepare a temporary guest
        shell: bash
        run: |
          set -euo pipefail
          test -c /dev/kvm
          sudo setfacl -m "u:$USER:rw" /dev/kvm
          if ! timeout 180 sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 update -qq; then
            echo '::error title=H037 toolchain::{"stage":"apt_update_failed"}'
            exit 1
          fi
          if ! timeout 180 sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 install -y -qq --no-install-recommends qemu-system-x86 qemu-utils xorriso tesseract-ocr aria2 p7zip-full; then
            echo '::error title=H037 toolchain::{"stage":"apt_install_failed"}'
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/pp-clean/answer"
          recipe="$GITHUB_WORKSPACE/.github/h006-clean-win10-portable"
          cp "$recipe/prepare.ps1" "$recipe/controller.py" "$RUNNER_TEMP/pp-clean/answer/"
          cp "$recipe/portable-guest.ps1" "$RUNNER_TEMP/pp-clean/answer/guest.ps1"
          cd "$RUNNER_TEMP/pp-clean"
          test "$(df --output=avail -B1 . | tail -1)" -ge 23622320128
          expected_helper=$(sed -n '/^const EXPECTED_HELPER_SHA256:/{n;s/[^0-9a-f]//g;p;q;}' "$GITHUB_WORKSPACE/src-tauri/src/runtime/manager.rs")
          [[ "$expected_helper" =~ ^[0-9a-f]{64}$ ]]
          printf '%s  %s\n' "$expected_helper" "$GITHUB_WORKSPACE/runtime/desktop_helper.py" | sha256sum -c -
          python3 - "$recipe/Autounattend.xml" <<'PY'
          from pathlib import Path
          import secrets
          import sys
          import xml.etree.ElementTree as ET
          source = Path(sys.argv[1]).read_text()
          assert source.count("EPHEMERAL-PASSWORD") == 2
          answer = source.replace("EPHEMERAL-PASSWORD", "Pp1-" + secrets.token_hex(20))
          ET.fromstring(answer)
          Path("answer/Autounattend.xml").write_text(answer)
          PY
          echo '::notice title=H037 download stage::{"stage":"windows_iso"}'
          if ! timeout 360 aria2c --dir=. --out=windows.iso \
            --max-connection-per-server=8 --split=8 --min-split-size=32M \
            --file-allocation=none --summary-interval=0 --console-log-level=warn \
            --connect-timeout=15 --timeout=30 --max-tries=2 --retry-wait=2 \
            --checksum=sha-256=ef7312733a9f5d7d51cfa04ac497671995674ca5e1058d5164d6028f0938d668 \
            'https://software-static.download.prss.microsoft.com/dbazure/988969d5-f34g-4e03-ac9d-1f9786c66750/19045.2006.220908-0225.22h2_release_svc_refresh_CLIENTENTERPRISEEVAL_OEMRET_x64FRE_en-us.iso'; then
            echo '::error title=H037 media preparation::Windows evaluation ISO download failed.'
            exit 1
          fi
          printf 'ef7312733a9f5d7d51cfa04ac497671995674ca5e1058d5164d6028f0938d668  windows.iso\n' | sha256sum -c -
          echo '::notice title=H037 preview download::{"stage":"preview_archive"}'
          curl --silent --show-error --fail --location --retry 1 --max-time 120 \
            --output preview.zip 'https://github.com/yukselbuilds/PennyPinch/releases/download/v0.1.1-preview.8/PennyPinch_0.1.1-preview.8_Windows_x64_preview.zip'
          python3 "$recipe/make-portable.py" "$GITHUB_WORKSPACE/runtime/desktop_helper.py" "$expected_helper"
          printf '::notice title=H037 verified inputs::%s\n' "$(sha256sum windows.iso preview.zip answer/portable.zip | tr '\n' ' ')"
          xorriso -as mkisofs -quiet -J -r -V PPAUDIT -o answer.iso answer
          qemu-img create -f qcow2 clean.qcow2 45G
      - name: Verify engine start and stop with the packaged controller
        shell: bash
        run: |
          cd "$RUNNER_TEMP/pp-clean"
          python3 "$GITHUB_WORKSPACE/.github/h006-clean-win10-portable/host.py"
