name: H041 native Windows file profile

on:
  push:
    branches:
      - codex/h041-native-file-check-20261126

permissions: {}

jobs:
  native-file-profile:
    if: github.repository == 'yukselbuilds/PennyPinch' && github.event.repository.visibility == 'public'
    runs-on: windows-2025
    timeout-minutes: 7
    steps:
      - name: Verify the standard runner and the pinned Codex binaries
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_ENVIRONMENT -ne 'github-hosted' -or $env:RUNNER_ARCH -ne 'X64') {
            throw 'Expected a GitHub-hosted x64 runner.'
          }
          $platform = Get-CimInstance Win32_OperatingSystem
          if ($platform.Caption -notmatch 'Windows Server 2025') { throw 'Expected Windows Server 2025.' }
          $principal = [Security.Principal.WindowsPrincipal]::new([Security.Principal.WindowsIdentity]::GetCurrent())
          if (!$principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)) {
            throw 'The isolated runner requires administrator setup.'
          }
          $root = [IO.Path]::GetFullPath((Join-Path $env:RUNNER_TEMP 'pennypinch-h041-file-profile'))
          New-Item -ItemType Directory -Path $root | Out-Null
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "PP_FILE_PROBE_ROOT=$root"
          $assetRoot = 'https://github.com/openai/codex/releases/download/rust-v0.171.0-alpha.13.2'
          function Receive-Pin([string]$asset, [string]$target, [string]$digest) {
            $file = Join-Path $root $target
            Invoke-WebRequest -Uri "$assetRoot/$asset" -OutFile $file -TimeoutSec 110 -MaximumRedirection 3
            if ((Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash -ne $digest) { throw 'Asset digest mismatch.' }
          }
          Receive-Pin 'codex-x86_64-pc-windows-msvc.exe.tar.gz' 'codex.tar.gz' '6a9de1bd10cd57b255f4ed31ab620e9b97854905ce51602eaaf56837b007dfeb'
          $archive = Join-Path $root 'codex.tar.gz'
          $entries = @(& tar.exe -tzf $archive)
          if ($LASTEXITCODE -ne 0 -or $entries.Count -ne 1 -or $entries[0] -notmatch '^(?:\./)?codex-x86_64-pc-windows-msvc\.exe$') {
            throw 'Unexpected archive contents.'
          }
          & tar.exe -xzf $archive -C $root $entries[0]
          if ($LASTEXITCODE -ne 0) { throw 'Archive extraction failed.' }
          Move-Item -LiteralPath (Join-Path $root 'codex-x86_64-pc-windows-msvc.exe') -Destination (Join-Path $root 'codex.exe')
          $cliDigest = '3b0b6d91b32a43b6e708a200445a7dff190b0116009ca29c3bca3623a1bbb69e'
          if ((Get-FileHash -LiteralPath (Join-Path $root 'codex.exe')).Hash -ne $cliDigest) { throw 'CLI digest mismatch.' }
          Receive-Pin 'codex-windows-sandbox-setup-x86_64-pc-windows-msvc.exe' 'codex-windows-sandbox-setup.exe' '74dbef6a8da18c14c8f80f60f91ea4c17f5ed2e6212487cca4060f6d66074c2b'
          Receive-Pin 'codex-command-runner-x86_64-pc-windows-msvc.exe' 'codex-command-runner.exe' '80fe20b26a2bcefc766d6c8d0f2402475e880f6ee873c5cedc0de640e1c09c0e'
          $version = & (Join-Path $root 'codex.exe') --version
          if ($LASTEXITCODE -ne 0 -or $version -ne 'codex-cli 0.171.0-alpha.13.2') { throw 'CLI version mismatch.' }
          Write-Host "Verified $version on $($platform.Caption) build $($platform.BuildNumber)."

      - name: Provision the elevated sandbox in the isolated runner
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = $env:PP_FILE_PROBE_ROOT
          $profile = Join-Path $root 'profile'
          $work = Join-Path $root 'workspace'
          New-Item -ItemType Directory -Path $profile,$work | Out-Null
          $env:CODEX_HOME = $profile
          $env:CODEX_SQLITE_HOME = Join-Path $root 'sqlite'
          $env:RUST_LOG = 'off'
          $cfg = Join-Path $profile 'config.toml'
          $defaults = @'
          approval_policy = "never"
          check_for_update_on_startup = false
          web_search = "disabled"
          chatgpt_base_url = "http://127.0.0.1:9/backend-api/"
          [windows]
          sandbox = "elevated"
          '@
          Set-Content -LiteralPath $cfg -Value $defaults -Encoding utf8NoBOM
          Push-Location -LiteralPath $work
          try {
            $report = & (Join-Path $root 'codex.exe') sandbox setup --elevated --current-user --codex-home $profile 2>&1
            if ($LASTEXITCODE -ne 0) {
              $diagnostic = ($report -join ' ') -replace '[A-Za-z]:[\\/][^\s"]+', '[path]'
              Write-Host ($diagnostic.Substring(0, [Math]::Min(360, $diagnostic.Length)))
              throw 'Sandbox setup failed.'
            }
          } finally { Pop-Location }

      - name: Verify exact allowed bytes, explicit denial, and restored access
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $root = $env:PP_FILE_PROBE_ROOT
          $work = Join-Path $root 'workspace'
          $env:CODEX_HOME = Join-Path $root 'profile'
          $env:CODEX_SQLITE_HOME = Join-Path $root 'sqlite'
          $env:RUST_LOG = 'off'
          $allowed = Join-Path $work 'approved.txt'
          $denied = Join-Path $work 'excluded.txt'
          $text = 'PennyPinch approved synthetic file.'
          [IO.File]::WriteAllText($allowed, $text)
          [IO.File]::WriteAllText($denied, 'PennyPinch synthetic deny probe.')
          $cfg = Join-Path $env:CODEX_HOME 'config.toml'
          $denyPath = ConvertTo-Json -InputObject $denied -Compress
          $settings = @"
          [permissions.probe-control.filesystem]
          ":root" = "read"
          ":workspace_roots" = "read"
          [permissions.probe-control.network]
          enabled = false
          [permissions.probe-denied.filesystem]
          ":root" = "read"
          ":workspace_roots" = "read"
          $denyPath = "deny"
          [permissions.probe-denied.network]
          enabled = false
          "@
          Add-Content -LiteralPath $cfg -Value ([Environment]::NewLine + $settings) -Encoding utf8NoBOM
          $cli = Join-Path $root 'codex.exe'
          $nativeShell = Join-Path $env:SystemRoot 'System32/WindowsPowerShell/v1.0/powershell.exe'
          function Get-InputFingerprints {
            $files = [ordered]@{
              cli = $cli
              setup = Join-Path $root 'codex-windows-sandbox-setup.exe'
              command_runner = Join-Path $root 'codex-command-runner.exe'
              configuration = $cfg
              allowed = $allowed
              excluded = $denied
              shell = $nativeShell
            }
            $hashes = [ordered]@{}
            foreach ($name in $files.Keys) {
              $hashes[$name] = (Get-FileHash -LiteralPath $files[$name]).Hash
            }
            return $hashes
          }
          function Get-ChangedInputs($old, $new) {
            foreach ($name in $old.Keys) {
              if ($old[$name] -ne $new[$name]) { $name }
            }
          }
          $phase = 'build_child_probe'
          trap {
            $kind = $_.Exception.GetType().Name
            $lineNumber = $_.InvocationInfo.ScriptLineNumber
            Write-Host "::error title=H041 file probe stopped::phase=$phase class=$kind line=$lineNumber"
            exit 1
          }
          $nativeCode = @'
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $identity = & whoami.exe
          if ($LASTEXITCODE -ne 0) { throw 'Windows identity check failed.' }
          $groups = & whoami.exe /groups /fo csv /nh
          if ($LASTEXITCODE -ne 0) { throw 'Windows group check failed.' }
          $row = @{
            started = $true
            offline = $identity -match '\\CodexSandboxOffline$'
            admin = [bool]($groups -match '\bS-1-5-32-544\b')
            language_mode = [string]$ExecutionContext.SessionState.LanguageMode
            allowed = $null
            allowed_error = $null
            excluded = 'unread'
          }
          try {
            $row.allowed = @(Get-Content -LiteralPath 'approved.txt' -Encoding Byte -Raw -ErrorAction Stop |
              ForEach-Object { foreach ($byte in $_) { [int]$byte } })
          } catch {
            $row.allowed_error = [string]$_.CategoryInfo.Category
          }
          try {
            $null = Get-Content -LiteralPath 'excluded.txt' -Encoding Byte -Raw -ErrorAction Stop
            $row.excluded = 'opened'
          } catch {
            $row.excluded = if ($_.CategoryInfo.Category -eq 'PermissionDenied') { 'access_denied' } else {
              [string]$_.CategoryInfo.Category
            }
          }
          Write-Output ('PP_FILE_RESULT=' + ($row | ConvertTo-Json -Compress))
          '@
          $encoded = [Convert]::ToBase64String([Text.Encoding]::Unicode.GetBytes($nativeCode))
          $exact = [Convert]::ToBase64String([IO.File]::ReadAllBytes($allowed))
          function Invoke-Probe([string]$profileName, [string]$expectedOutside) {
            $probeArgs = @('sandbox','--include-managed-config','--permission-profile',$profileName,'-C',$work,
                           '--',$nativeShell,'-NoLogo','-NoProfile','-NonInteractive','-EncodedCommand',$encoded)
            $output = & $cli @probeArgs 2>&1
            if ($LASTEXITCODE -ne 0) {
              $sample = (($output -join ' ') -replace '[A-Za-z]:[\\/][^\s"]+', '[path]' -replace '[A-Za-z0-9_%-]{28,}', '[redacted]' -replace '[\x00-\x1f]+', ' ')
              $sample = $sample.Substring(0, [Math]::Min(224, $sample.Length))
              $printed = [regex]::Replace($sample, '[^\w .:,\-\[\]()]', ' ')
              Write-Host "::error title=H041 bounded diagnostic::$printed"
              $diagnostic = ($output -join ' ').ToLowerInvariant()
              $safeWords = 'error','permission','profile','filesystem','elevated','unsupported','backend','setup','mismatch',
                           'command','failed','access','denied','missing','system','invalid','syntax','application','unavailable',
                           'interactive','runner','sandbox','refresh','startup','spawn','incorrect','handle','logon','user','requires',
                           'powershell','root','read','write','argument','policy','process','could','cannot','unknown','file','not','found'
              $words = ([regex]::Matches($diagnostic, '[a-z]+').Value | Where-Object { $_ -in $safeWords } | Select-Object -First 45) -join ' '
              $codes = ([regex]::Matches($diagnostic, '\b(?:os error |error |winerror |0x)[0-9a-f]{2,8}\b').Value | Select-Object -First 4) -join ' '
              Write-Host "::error title=H041 Codex sandbox command::profile=$profileName code=$LASTEXITCODE words=$words os_codes=$codes"
              throw 'Codex sandbox command failed.'
            }
            $line = @($output | Where-Object { $_ -is [string] -and $_.StartsWith('PP_FILE_RESULT=') })
            if ($line.Count -ne 1) { throw 'Expected one tagged native result.' }
            $r = $line[0].Substring('PP_FILE_RESULT='.Length) | ConvertFrom-Json
            $matched = $null -ne $r.allowed -and [Convert]::ToBase64String([byte[]]$r.allowed) -ceq $exact
            $acceptOutside = if ($expectedOutside -eq 'observe') {
              $r.excluded -in @('opened','access_denied')
            } else { $r.excluded -eq $expectedOutside }
            if (!$r.started -or !$r.offline -or $r.admin -or !$matched -or !$acceptOutside) {
              Write-Host "::error title=H041 native result mismatch::profile=$profileName started=$($r.started) offline=$($r.offline) admin=$($r.admin) allowed=$matched allowed_error=$($r.allowed_error) excluded=$($r.excluded)"
              throw 'Native file boundary did not match the expected result.'
            }
            Write-Host "::notice title=H041 native file result::$profileName allowed=exact excluded=$($r.excluded) sandbox=offline_nonadmin language=$($r.language_mode)"
            return $r.excluded
          }
          $phase = 'initialize_profile'
          $preSetup = Get-InputFingerprints
          $null = Invoke-Probe 'probe-control' 'opened'
          $before = Get-InputFingerprints
          $initialized = @(Get-ChangedInputs $preSetup $before)
          if (@($initialized | Where-Object { $_ -ne 'configuration' }).Count -ne 0) {
            throw 'A non-configuration input changed during the first control.'
          }
          $phase = 'control'
          $null = Invoke-Probe 'probe-control' 'opened'
          $access = [Security.AccessControl.AccessControlSections]::Access
          $baselineAcl = (Get-Acl -LiteralPath $denied).GetSecurityDescriptorSddlForm($access)
          function Restore-ProbeAcl {
            $fixture = Get-Item -LiteralPath $denied
            if ($fixture.FullName -ne (Join-Path $work 'excluded.txt') -or
                $fixture.Attributes.HasFlag([IO.FileAttributes]::ReparsePoint)) { throw 'Unexpected test file scope.' }
            $current = Get-Acl -LiteralPath $denied
            if ($current.GetSecurityDescriptorSddlForm($access) -ne $baselineAcl) {
              $current.SetSecurityDescriptorSddlForm($baselineAcl, $access)
              Set-Acl -LiteralPath $denied -AclObject $current
            }
            if ((Get-Acl -LiteralPath $denied).GetSecurityDescriptorSddlForm($access) -ne $baselineAcl) {
              throw 'The fixture access control list did not match its baseline.'
            }
          }
          try {
            $phase = 'deny'
            $null = Invoke-Probe 'probe-denied' 'access_denied'
            $phase = 'observe_profile_switch'
            $switchResult = Invoke-Probe 'probe-control' 'observe'
          } finally {
            $phase = 'restore_owned_fixture'
            Restore-ProbeAcl
          }
          try {
            $phase = 'control_after_fixture_cleanup'
            $null = Invoke-Probe 'probe-control' 'opened'
          } finally {
            $phase = 'restore_fixture_after_final_control'
            Restore-ProbeAcl
          }
          $phase = 'fingerprint_sources'
          $after = Get-InputFingerprints
          $changed = @(Get-ChangedInputs $before $after)
          if ($changed.Count -ne 0) {
            Write-Host "::error title=H041 changed verification inputs::changed=$($changed -join ',') initialized=$($initialized -join ',')"
            throw 'Verification inputs changed.'
          }
          $hashInput = [Text.Encoding]::UTF8.GetBytes(($before | ConvertTo-Json -Compress))
          $combined = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($hashInput)).ToLowerInvariant()
          $result = [ordered]@{
            result = 'native_file_boundary_verified'
            target = 'Windows Server 2025 x64 standard runner'
            cli = '0.171.0-alpha.13.2'
            checks = @('both_opened','allowed_exact_and_denied','both_opened_again')
            profile_switch_before_fixture_cleanup = $switchResult
            file_acl_restored_by_fixture = $true
            initialized_inputs = $initialized
            matched_inputs = $before.Count
            inputs_sha256_before_after = $combined
            allowed_bytes = [Text.Encoding]::UTF8.GetByteCount($text)
            external_model_requests = 0
          }
          $json = $result | ConvertTo-Json -Compress
          Write-Host "::notice title=H041 native scope receipt::$json"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value $json
