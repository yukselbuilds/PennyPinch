name: PennyPinch portable engine on Windows 11 x64
on:
  push:
    branches: [codex/windows11-portable-011]
permissions:
  contents: read
concurrency:
  group: pennypinch-win11-portable-011
  cancel-in-progress: false
jobs:
  windows11:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Prepare the official Windows 11 x64 evaluation guest
        shell: bash
        run: |
          set -euo pipefail
          test -c /dev/kvm
          sudo setfacl -m "u:$USER:rw" /dev/kvm
          timeout 180 sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 update -qq
          timeout 180 sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 install -y -qq --no-install-recommends qemu-system-x86 qemu-utils xorriso tesseract-ocr aria2 ovmf swtpm p7zip-full ntfs-3g
          recipe="$GITHUB_WORKSPACE/.github/pennypinch-win11"
          mkdir -p "$RUNNER_TEMP/pennypinch-win11/answer"
          cd "$RUNNER_TEMP/pennypinch-win11"
          test "$(df --output=avail -B1 . | tail -1)" -ge 24696061952
          test -f /usr/share/OVMF/OVMF_CODE_4M.secboot.fd
          cp /usr/share/OVMF/OVMF_VARS_4M.ms.fd firmware-vars.fd
          cp "$recipe/"{portable-guest.ps1,prepare.ps1,controller.py,candidate.json} answer/
          echo '::notice title=Windows 11 media::{ "source": "Microsoft Evaluation Center", "edition": "Enterprise LTSC", "architecture": "x64" }'
          timeout 485 aria2c --dir=. --out=windows.iso --max-connection-per-server=8 --split=8 --min-split-size=32M \
            --file-allocation=none --summary-interval=0 --console-log-level=warn --connect-timeout=15 --timeout=30 --max-tries=3 \
            'https://software-static.download.prss.microsoft.com/dbazure/888969d5-f34g-4e03-ac9d-1f9786c66749/26100.1742.240906-0331.ge_release_svc_refresh_CLIENT_LTSC_EVAL_x64FRE_en-us.iso'
          test "$(stat -c %s windows.iso)" = 5112850432
          iso_sha256="$(sha256sum windows.iso | cut -d' ' -f1)"
          test "$iso_sha256" = "67cec5865eaa037a72ddc633a717a10a2bed50778862267223ddb9c60ef5da68"
          printf '::notice title=Windows 11 ISO SHA-256::%s\n' "$iso_sha256"
          curl --silent --show-error --fail --location --retry 2 --max-time 180 --output release.zip \
            'https://github.com/yukselbuilds/PennyPinch/releases/download/v0.1.1/PennyPinch_0.1.1_Windows_x64.zip'
          python3 - "$recipe/Autounattend.xml" <<'PY'
          from hashlib import file_digest
          import json
          from pathlib import Path
          import secrets
          import shutil
          import sys
          import xml.etree.ElementTree as ET
          from zipfile import ZipFile

          root = Path("answer")
          candidate = json.loads((root / "candidate.json").read_bytes())
          with Path("release.zip").open("rb") as archive:
              assert file_digest(archive, "sha256").hexdigest() == candidate["archive_sha256"]
          with ZipFile("release.zip") as bundle, bundle.open("PennyPinch_0.1.1_x64-setup.exe") as source:
              with (root / "setup.exe").open("xb") as target:
                  shutil.copyfileobj(source, target, 1024 * 1024)
          for name, field in (("setup.exe", "installer_sha256"),):
              with (root / name).open("rb") as stream:
                  assert file_digest(stream, "sha256").hexdigest() == candidate[field]
          template = Path(sys.argv[1]).read_text()
          assert template.count("EPHEMERAL-PASSWORD") == 2
          answer = template.replace("EPHEMERAL-PASSWORD", "Pp1-" + secrets.token_hex(20))
          ET.fromstring(answer)
          (root / "Autounattend.xml").write_text(answer)
          print("Verified the stable installer and the update test executable.")
          PY
          python3 "$recipe/make-portable.py"
          xorriso -as mkisofs -quiet -J -r -V PPAUDIT -o answer.iso answer
          qemu-img create -f qcow2 clean.qcow2 70G
      - name: Verify the packaged engine after Windows Setup boots from disk
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/pennypinch-win11"
          mkdir tpm
          swtpm socket --tpm2 --tpmstate dir="$PWD/tpm" --ctrl type=unixio,path="$PWD/tpm-control.sock" --flags not-need-init,startup-clear &
          tpm_pid=$!
          trap 'kill "$tpm_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 50); do
            if test -S tpm-control.sock; then break; fi
            sleep 0.1
          done
          test -S tpm-control.sock
          python3 "$GITHUB_WORKSPACE/.github/pennypinch-win11/host.py"
      - name: Read the Windows Setup failure codes from the offline disk
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/pennypinch-win11"
          if ! test -f setup-timeout.ppm; then exit 0; fi
          mkdir -p setup-diagnostics
          if sudo modprobe nbd max_part=8 && test -b /dev/nbd0; then
            sudo qemu-nbd --format=qcow2 --read-only --connect=/dev/nbd0 clean.qcow2
            mkdir -p setup-mount
            trap 'sudo umount setup-mount 2>/dev/null || true; sudo qemu-nbd --disconnect /dev/nbd0 >/dev/null 2>&1 || true' EXIT
            sudo udevadm settle --timeout=10
            test -b /dev/nbd0p3 || sudo partx --add /dev/nbd0
            sudo udevadm settle --timeout=10
            sudo ntfs-3g -o ro,norecover /dev/nbd0p3 setup-mount
            sudo cp -n setup-mount/Windows/Panther/{setupact,setuperr}.log setup-diagnostics/ || true
            sudo cp -n setup-mount/Windows/Panther/UnattendGC/setupact.log setup-diagnostics/oobe.log || true
          else
            timeout 180 sudo apt-get -o Acquire::Retries=2 install -y -qq --no-install-recommends libguestfs-tools
            sudo env LIBGUESTFS_BACKEND=direct LIBGUESTFS_MEMSIZE=768 timeout 180 guestfish --ro --format=qcow2 -a clean.qcow2 -m /dev/sda3:/ <<'GUEST'
          -download /Windows/Panther/setupact.log setup-diagnostics/setupact.log
          -download /Windows/Panther/setuperr.log setup-diagnostics/setuperr.log
          -download /Windows/Panther/UnattendGC/setupact.log setup-diagnostics/oobe.log
          GUEST
          fi
          sudo python3 "$GITHUB_WORKSPACE/.github/pennypinch-win11/setup-summary.py"
      - name: Save the blocked Windows Setup screen
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: windows11-setup-screen
          path: ${{ runner.temp }}/pennypinch-win11/setup-timeout.ppm
          if-no-files-found: ignore
          retention-days: 1
