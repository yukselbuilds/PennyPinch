[package]
name = "headroom-desktop"
version = "0.1.0"
description = "Headroom local desktop control surface"
authors = ["Headroom"]
edition = "2021"
rust-version = "1.90"

[build-dependencies]
tauri-build = { version = "=2.7.3", features = [] }

[features]
custom-protocol = ["tauri/custom-protocol"]
update-fixture = []

[dependencies]
tauri = { version = "=2.12.4", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "=1.0.154"
jsonc-parser = { version = "=0.34.0", features = ["serde_json"] }
sha2 = "=0.10.9"
base64 = "=0.23.1"
minisign-verify = "=0.3.0"
semver = "=1.0.28"
rusqlite = { version = "=0.41.1", default-features = false, features = ["bundled"] }
chrono = "=0.4.45"
time = { version = "0.3", features = ["formatting", "parsing"] }
toml = "=1.1.8"
uuid = { version = "1", features = ["v4"] }
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Networking_WinSock", "Win32_Security", "Win32_Security_WinTrust", "Win32_Security_Cryptography_Catalog", "Win32_Security_Cryptography_Sip", "Win32_Security_Cryptography", "Win32_NetworkManagement_IpHelper", "Win32_Storage_FileSystem", "Win32_Storage_Packaging_Appx", "Win32_System_Diagnostics_ToolHelp", "Win32_System_IO", "Win32_System_Ioctl", "Win32_System_JobObjects", "Win32_System_Registry", "Win32_System_Threading", "Win32_System_WindowsProgramming", "Win32_System_SystemServices", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(windows)'.dependencies]
reqwest = { version = "=0.13.5", default-features = false, features = ["blocking", "native-tls"] }
windows = { version = "=0.62.2", default-features = false, features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_Shell_Common"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "=0.10.1"
dispatch2 = "=0.3.1"
libc = "=0.2.191"
objc2 = "=0.6.5"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSApplication", "NSOpenPanel", "NSSavePanel", "NSPanel", "NSWindow", "NSResponder"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSArray", "NSString", "NSURL"] }
socket2 = "=0.6.5"

[target.'cfg(target_os = "macos")'.dev-dependencies]
block2 = "=0.6.2"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["NSRunningApplication", "NSPasteboard", "NSWorkspace"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["NSTimer", "NSRunLoop", "NSDate", "block2"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
strip = true

# Discovery hashes installed binaries; keep debug builds responsive too.
[profile.dev.package.sha2]
opt-level = 3
